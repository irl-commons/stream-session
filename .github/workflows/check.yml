name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fixtures, standard library only
        run: python tools/stream_session.py test
      - name: Tests, standard library only
        run: python -m unittest discover -s tests
      - name: Schema is valid JSON
        run: python -m json.tool schema/stream-session.v0.schema.json > /dev/null

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openstreambox/stream-status
          path: stream-status
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "jsonschema==4.23.0"
      - name: Built-in schema evaluator agrees with jsonschema; shared snapshots are valid stream-status
        env:
          STREAM_STATUS_DIR: stream-status
        run: python -m unittest discover -s tests -v
